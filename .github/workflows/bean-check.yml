# Validates the ledger with the official Beancount checker on every push.
# Ledger X shows the result of this workflow on its Overview page.
name: bean-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python 和依赖按 .python-version / uv.lock 安装，与本机 uv sync 一致
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen --no-dev
      - name: bean-check
        run: uv run bean-check main.bean
      - name: Smoke-test the saved queries
        run: |
          uv run bean-query main.bean "SELECT account, SUM(position) WHERE account ~ '^Assets:' GROUP BY account ORDER BY account"
      - name: Verify demo scenarios and all saved queries
        run: uv run tools/verify.py
